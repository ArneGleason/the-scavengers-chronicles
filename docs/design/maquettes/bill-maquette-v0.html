/* ---------- UI + hash hooks ---------- */
function setPressed() {

}

{ // orbit (yaw) by drag, zoom by wheel / pinch

  torso.rotation.set(p.lean, p.tyaw, p.troll); body.scale.set(1 + 0.008 * p.breath, 1 + 0.004 * p.breath, 1 + 0.014 * p.breath);

});

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Scavenger's Chronicles</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Shantell+Sans:wght@500;700&family=Courier+Prime:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap"
    />
    <style>
      :root {
        --ink: #1e1a18;
        --paper: #efe9dc;
        --caption: #f9f5b0;
        --salvage: #f2b632;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
      body { font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      [hidden] { display: none !important; }

      .balloon {
        position: absolute; left: 0; top: 0; max-width: min(340px, 70vw);
        background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; padding: 10px 16px 11px;
        font: 700 16px/1.25 "Shantell Sans", "Comic Sans MS", sans-serif; font-variation-settings: "BNCE" 25, "INFM" 30;
        --tail: 30px;
      }
      .balloon::after, .balloon::before {
        content: ""; position: absolute; top: 100%; left: var(--tail); border-style: solid;
      }
      .balloon::before { border-width: 16px 10px 0 4px; border-color: var(--ink) transparent transparent; margin-top: 0; }
      .balloon::after { border-width: 11px 7px 0 2px; border-color: #fff transparent transparent; margin-left: 2px; margin-top: -1px; }

      .caption {
        position: absolute; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
        max-width: min(620px, calc(100vw - 32px)); background: var(--caption); border: 2px solid var(--ink);
        box-shadow: 3px 3px 0 var(--ink); padding: 9px 14px; font: 400 16px/1.35 "Courier Prime", "Courier New", monospace;
      }
      .prompt {
        position: absolute; left: 0; top: 0; white-space: nowrap; background: var(--ink); color: #fff7e3;
        border-radius: 999px; padding: 4px 11px 5px; font: 700 13px/1.2 "Shantell Sans", sans-serif;
        box-shadow: 0 0 0 2px var(--salvage);
      }
      .satchel {
        position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        display: grid; grid-template-columns: auto auto auto auto; align-items: center; gap: 6px 8px;
        background: rgba(239, 233, 220, 0.92); border: 2px solid var(--ink); border-radius: 10px; padding: 7px 10px;
        font: 700 11px/1.1 "Atkinson Hyperlegible Next", sans-serif; text-transform: uppercase; letter-spacing: 0.06em;
      }
      .satchel .slots { display: flex; gap: 5px; }
      .slot { width: 64px; height: 38px; border: 1.5px solid var(--ink); border-radius: 6px; background: #fffaf0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
      .slot.empty { background: repeating-linear-gradient(45deg, #efe6d2 0 4px, #f7f1e4 4px 8px); }
      .slot i { width: 14px; height: 10px; border: 2px solid; border-radius: 3px; }
      .slot span { font-size: 9px; letter-spacing: 0.02em; text-transform: none; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .help {
        position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; grid-template-columns: auto auto; gap: 4px 12px;
        background: rgba(239, 233, 220, 0.92); border: 2px solid var(--ink); border-radius: 10px; padding: 9px 12px; font-size: 13px;
        transition: opacity 0.6s;
      }
      .help b { grid-column: 1 / -1; font-family: "Shantell Sans", sans-serif; font-size: 15px; }
      .help.faded { opacity: 0.35; }
      kbd { font: 700 11px/1 "Atkinson Hyperlegible Next", sans-serif; border: 1.5px solid var(--ink); border-bottom-width: 3px; border-radius: 4px; padding: 1px 5px; background: #fff; }
      .objective {
        position: absolute; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: min(360px, calc(100vw - 32px));
        background: var(--caption); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 7px 11px 8px;
        display: grid; gap: 2px; font: 400 13px/1.3 "Courier Prime", "Courier New", monospace;
      }
      .objective small { font: 700 10px/1 "Atkinson Hyperlegible Next", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
      .objective b { font: 700 16px/1.15 "Shantell Sans", sans-serif; }
      .marker { position: absolute; left: 0; top: 0; width: 32px; height: 32px; display: grid; place-items: center; }
      .marker span { font-size: 26px; line-height: 1; color: var(--salvage); -webkit-text-stroke: 2px var(--ink); text-shadow: 0 2px 0 var(--ink); }
      .marker.edge span { font-size: 30px; }
      .debug { position: absolute; left: 16px; top: 130px; font: 12px/1.4 ui-monospace, Menlo, monospace; background: rgba(30,26,24,.8); color: #f4efe4; padding: 6px 9px; border-radius: 6px; white-space: pre; }
      .gas {
        position: absolute; left: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 5px;
        background: rgba(239, 233, 220, 0.92); border: 2px solid var(--ink); border-radius: 10px; padding: 5px 9px;
        font: 700 11px/1 "Atkinson Hyperlegible Next", sans-serif; text-transform: uppercase; letter-spacing: 0.06em;
      }
      .gas span { margin-right: 3px; }
      .gas i { width: 16px; height: 20px; border: 2px solid var(--ink); border-radius: 50% 50% 45% 45%; background:
        linear-gradient(to top, #9bbf3b var(--f), #fffaf0 var(--f)); }
      .gas i.full { background: #9bbf3b; box-shadow: inset -3px -3px 0 rgba(0,0,0,.15); }
      .gas kbd { margin-left: 4px; }
      .challenge {
        position: absolute; left: 50%; top: calc(18% + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
        display: grid; justify-items: center; gap: 8px; min-width: min(420px, calc(100vw - 32px));
        background: #fff; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 10px 16px 12px;
      }
      .challenge b { font: 400 34px/1 Bangers, Impact, sans-serif; letter-spacing: 0.04em; color: #c8312d; -webkit-text-stroke: 1px var(--ink); }
      .challenge .meter { position: relative; width: 100%; height: 22px; border: 2.5px solid var(--ink); border-radius: 999px;
        background: repeating-linear-gradient(45deg, #efe6d2 0 6px, #f7f1e4 6px 12px); overflow: visible; }
      .challenge .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: #f2b632; transition: width 0.06s linear; }
      .challenge .meter em { position: absolute; top: -9px; width: 8px; height: 36px; margin-left: -4px; background: var(--ink); border-radius: 3px; transition: left 0.06s linear; }
      .challenge .mash { font: 400 26px/1 Bangers, Impact, sans-serif; letter-spacing: 0.05em; transition: transform 0.05s; }
      .challenge .mash.big { transform: scale(1.18) rotate(-3deg); }
      .challenge .mash kbd { font-size: 18px; padding: 1px 7px; }
      .jam {
        position: absolute; left: 50%; top: calc(16% + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
        display: grid; justify-items: center; gap: 6px; background: #1e1a18; color: #fff7e3;
        border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--salvage); padding: 10px 22px 12px;
      }
      .jam b { font: 400 30px/1 Bangers, Impact, sans-serif; letter-spacing: 0.06em; color: var(--salvage); }
      .jam .notes { display: flex; gap: 14px; }
      .jam .notes i { font: 400 34px/1 Bangers, sans-serif; font-style: normal; opacity: 0.25; transition: transform 0.08s, opacity 0.08s; }
      .jam .notes i.on { opacity: 1; transform: scale(1.25) rotate(-6deg); color: #8fd0f0; }
      .jam .notes i.sour { color: #b5d94a; transform: scale(1.4) rotate(14deg) skewX(-18deg); }
      .jam .press { font: 400 20px/1 Bangers, Impact, sans-serif; letter-spacing: 0.05em; }
      .jam .press kbd { font-size: 16px; padding: 1px 8px; color: var(--ink); }
      .soup {
        position: absolute; left: 16px; bottom: calc(126px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 8px;
        background: rgba(239, 233, 220, 0.92); border: 2px solid var(--ink); border-radius: 10px; padding: 5px 9px;
        font: 700 11px/1 "Atkinson Hyperlegible Next", sans-serif; text-transform: uppercase; letter-spacing: 0.06em;
      }
      .soup div { display: flex; gap: 3px; }
      .soup div i { width: 9px; height: 12px; border: 1.5px solid var(--ink); border-radius: 3px 3px 5px 5px; background: #fffaf0; }
      .soup div i.on { background: #c8703f; }
      .soup small { grid-column: 1 / -1; font-size: 10px; letter-spacing: 0.02em; text-transform: none; opacity: 0.85; }
      .phone {
        position: absolute; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 210px;
        background: #1e1a18; border: 3px solid var(--ink); border-radius: 22px; padding: 12px 9px 16px; box-shadow: 4px 4px 0 rgba(30, 26, 24, 0.5);
        animation: phone-up 0.25s ease-out;
      }
      @keyframes phone-up { from { transform: translateY(40px) rotate(4deg); opacity: 0; } }
      .phone .screen { background: #f4f1e6; border-radius: 12px; padding: 8px 9px 9px; display: grid; gap: 5px; font: 400 12px/1.25 "Atkinson Hyperlegible Next", sans-serif; }
      .phone small { font: 700 9px/1 "Atkinson Hyperlegible Next", sans-serif; letter-spacing: 0.12em; opacity: 0.6; }
      .phone b { font: 700 14px/1.1 "Shantell Sans", sans-serif; }
      .phone .photo { height: 70px; border-radius: 8px; background: #5f7f79; display: grid; place-items: center; }
      .phone .photo i { width: 74px; height: 44px; border-radius: 50%; border: 3px solid #f4f1e6; background: radial-gradient(circle at 40% 40%, #e39a55, #b4502c 70%); }
      .phone .send { display: grid; gap: 3px; font-size: 11px; }
      .phone .send em { height: 5px; border-radius: 3px; background: #d8d0bd; overflow: hidden; }
      .phone .send em i { display: block; height: 100%; width: 0; background: #2aa6a1; }
      .phone.sending .send em i { animation: send 0.8s linear forwards; }
      .phone.sent .send em i { width: 100%; }
      @keyframes send { to { width: 100%; } }
      .phone ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      .phone li { background: #fff; border: 1.5px solid #d0c7b2; border-radius: 10px 10px 10px 3px; padding: 4px 7px; animation: reply 0.2s ease-out; }
      .phone li b { font: 700 11px/1 "Atkinson Hyperlegible Next", sans-serif; display: block; margin-bottom: 1px; }
      @keyframes reply { from { transform: scale(0.6); opacity: 0; } }
      .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      .flash.go { animation: flash 0.4s ease-out; }
      @keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 22px "Shantell Sans", sans-serif; }
      @media (max-width: 640px) {
        .help { display: none; }
        .gas { left: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
        .challenge b { font-size: 28px; }
        .soup { left: 12px; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
        .phone { right: 12px; bottom: auto; top: calc(96px + env(safe-area-inset-top, 0px)); width: 180px; }
        .objective { font-size: 12px; }
        .satchel { left: 12px; right: 12px; grid-template-columns: auto auto; justify-content: center; }
        .satchel .label { display: none; }
        .slot { width: 52px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="The Scavenger's Chronicles: Bill's house"></canvas>
    <div id="hud"></div>
    <div id="loading">Bill is looking for the right cable&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
